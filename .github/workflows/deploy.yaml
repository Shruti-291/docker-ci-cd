name: Deploy Nodejs Application to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
   # server name that we are using on hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with: 
          #in github there is secret option in left side where we put ip address and ssh key as secret 
          host: ${{secrets.SSH_HOST }}
          username: root
          key: ${{secrets.SSH_KEY}}
          script:
            #path in the server where we want to run
            cd /root/nodejs-application-deploy-github-actions 
            git pull
            docker compose up -d --build
